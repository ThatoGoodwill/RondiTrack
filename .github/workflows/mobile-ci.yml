name: Mobile foundations CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths: ['mobile/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter create . --org za.co.thatogoodwill --project-name ronditrack_mobile --platforms android,ios
      - run: rm -f test/widget_test.dart
      - run: git checkout -- analysis_options.yaml
      - run: flutter pub get
      # Draft bootstrap. Replace with --set-exit-if-changed after committing formatted files.
      - run: dart format lib test
      - run: dart run build_runner build
      - run: dart analyze --fatal-infos
      - run: flutter test
